<html lang="en">
   <head>
     <meta charset="UTF-8">
     <title>ESCFlix</title>
     <style>
    body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 40px 20px;
    background: #141414;
    color: #fff;
  }
 
  h4 {
    font-size: 1.5rem;
    font-weight: bold;
    color: #e5e5e5;
    margin: 0 0 10px 10px;
  }
 
  .carousel-section {
    width: 90%;
    max-width: 1200px;
    margin: 0 auto 50px auto;
  }
 
  .carousel-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
  }
 
  .carousel-button {
    background: transparent;
    border: none;
    color: #e5e5e5;
    font-size: 3rem;
    cursor: pointer;
    margin: 0 10px;
    transition: color 0.3s, transform 0.3s;
  }
 
  .carousel-button:hover {
    color: #fff;
    transform: scale(1.2);
  }
 
  .carousel-container {
    position: relative;
    width: 90%;
    max-width: 1200px;
    overflow: hidden;
  }
 
  .carousel-track {
    display: flex;
    transition: transform 0.3s ease;
    scroll-behavior: smooth;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
 
  .carousel-track::-webkit-scrollbar {
    display: none;
  }
 
  .video-item {
    flex: 0 0 calc(20% - 20px); /* 5 per view with spacing */
    margin: 10px;
    background: #1f1f1f;
    border-radius: 6px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
  }
 
  .video-item:hover {
    transform: scale(1.1);
    z-index: 1;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
  }
 
  .preview-container {
    width: 100%;
    height: 170px;
    position: relative;
  }
 
  .preview-container img,
  .preview-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
  }
 
  .preview-container video {
    display: none;
  }
 
  .video-title {
    color: #e5e5e5;
    background: #1f1f1f;
    padding: 10px;
    font-size: 0.75rem;
    text-align: center;
  }
 
  .video-title-text::first-line {
   font-size: 0.85rem;
   font-weight: bold;
  }
 
   .video-title-with-icon {
     display: flex;
     color: #e5e5e5;
     background: #1f1f1f;
     align-items: center;
     gap: 8px;
     margin-top: 8px;
     padding: 10px;
     font-size: 0.75rem;
   }
 
   .icon-placeholder {
     width: 24px;
     height: 24px;
     border-radius: 50%;
     background-color: #444; /* Optional: for visibility until image is added */
     object-fit: cover;
     margin-left: 8px; /* This moves the icon to the right */
   }
 
   .video-title-text {
     line-height: 1.2;
   }
 
 
  .modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
  }
 
  .modal-content {
    position: relative;
    background-color: #000;
    padding: 20px;
    max-width: 90%;
    max-height: 90%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
 
  .modal-content video {
    max-width: 100%;
    max-height: 80vh;
  }
 
  .close-button {
    position: absolute;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    font-size: 40px;  /* Increase the size */
    top: 10px;
    right: 20px;
    z-index: 9999;
    border-radius: 50%;
  }

.section-header {
  display: flex;
  align-items: baseline;
  gap: 20px;
  margin: 0 10px 10px 10px;
}

.section-header h4 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: bold;
  color: #e5e5e5;
}

.section-header .view-more {
  margin: 0;
  font-size: 0.9rem;
  font-weight: normal;
  color: #e50914;
  text-decoration: none;
}

.section-header .view-more:visited,
.section-header .view-more:hover,
.section-header .view-more:active,
.section-header .view-more:focus {
  color: #e50914;
  text-decoration: none;
}

.grid-container {
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* Adjust number of columns */
  gap: 20px;
}

.video-item {
  background-color: #333; /* Optional for visual separation */
  border-radius: 8px;
  overflow: hidden;
  transition: transform 0.3s ease;
}

.video-item:hover {
  transform: scale(1.05);
}
        
 
   </style>
   </head>
   <body oncontextmenu="return false">
 
 
<div class="grid-section">
  <div class="section-header">
    <h4>Eurovision Winners</h4>
    <a class="view-more" href="belgium.html">VIEW MORE</a>
  </div>

  <div class="grid-container">

        <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2015/videos/2015-SE.mp4" muted loop></video>
      </div>
      <div class="video-title-with-icon" onclick="event.stopPropagation()">

    <!-- 2016 - UKRAINE -->
    <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2016/videos/2016-UA.mp4')">
      <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
        <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2016/thumbs/2016-UA.jpeg" alt="Ukraine 2016 - Jamala">
        <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2016/videos/2016-UA.mp4" muted loop></video>
      </div>
      <div class="video-title-with-icon" onclick="event.stopPropagation()">
        <a href="belgium.html">
          <img class="icon-placeholder" src="https://euroflix.s3.eu-north-1.amazonaws.com/flags/ua.png" alt="Flag">
        </a>
        <div class="video-title-text">Jamala<br>1944<br>2016</div>
      </div>

    <!-- 2017 - PORTUGAL -->
    <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2017/videos/2017-PT.mp4')">
      <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
        <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2017/thumbs/2017-PT.jpeg" alt="Portugal 2017 - Salvador Sobral">
        <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2017/videos/2017-PT.mp4" muted loop></video>
      </div>
      <div class="video-title-with-icon" onclick="event.stopPropagation()">
        <a href="belgium.html">
          <img class="icon-placeholder" src="https://euroflix.s3.eu-north-1.amazonaws.com/flags/pt.png" alt="Flag">
        </a>
        <div class="video-title-text">Salvador Sobral<br>Amar pelos dois<br>2017</div>
      </div>
    </div>

    <!-- Add the rest of your videos here in the same format -->

  </div>
</div>
       </div>
     </div>
     </div>
 
 
 
 
              <!-- Modal -->
  <div id="videoModal" class="modal" onclick="closeModal(event)">
    <span class="modal-close" onclick="closeModal(event)">&times;</span>
    <video id="modalVideo" controls autoplay controlsList="nodownload"></video>
  </div>
 
 
     <script>
 
        function scrollCarousel(direction, trackId) {
      const track = document.getElementById(trackId);
      const itemWidth = track.querySelector('.video-item').offsetWidth + 20; // includes margin
      const scrollAmount = itemWidth * 5; // scroll 5 items
 
      track.scrollBy({
        left: direction * scrollAmount,
        behavior: 'smooth'
      });
    }
 
 
 
      function openModalWithVideo(videoUrl) {
   const modal = document.createElement('div');
   modal.classList.add('modal');
   modal.style.display = 'flex';
 
   modal.innerHTML = `
     <div class="modal-content">
       <span class="close-button" onclick="document.body.removeChild(this.closest('.modal'))">&times;</span>
       <video 
         src="${videoUrl}" 
         controls 
         autoplay 
         controlsList="nodownload" 
         oncontextmenu="return false"
       ></video>
     </div>
   `;
 
   document.body.appendChild(modal);
 }
 
 
 
       function closeModal() {
         const modal = document.getElementById("videoModal");
         const container = document.getElementById("modalVideoContainer");
         modal.style.display = "none";
         container.innerHTML = "";
       }
 
    function showPreview(container) {
      const video = container.querySelector('video');
      const img = container.querySelector('img');
      img.style.display = 'none';
      video.style.display = 'block';
      video.play();
    }
 
 
    function hidePreview(container) {
      const video = container.querySelector('video');
      const img = container.querySelector('img');
      video.pause();
      video.style.display = 'none';
      img.style.display = 'block';
    }
 
 
     </script>
 
   </body>
   </html>
