<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Douze Points | Belgium</title>
  <style>
    body {
      background-color: #141414;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      padding: 1rem;
      font-size: 2rem;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* Adjust number of columns */
      gap: 20px;
    }

    .video-section {
      padding: 1rem 2rem;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 4rem 1.5rem; /* 1rem for columns, 4rem for rows */
    }
    
    .preview-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
    }

    .preview-container img,
    .preview-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    .preview-container img {
      z-index: 1;
    }

    .preview-container video {
      z-index: 2;
      display: none;
    }

    .video-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
      z-index: 3;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .preview-container:hover .video-info {
      opacity: 1;
    }

    .video-title {
      font-size: 1rem;
      font-weight: bold;
    }

    .video-description {
      font-size: 0.85rem;
      margin-top: 0.25rem;
      color: #ccc;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
    }

    .modal video {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
    }

    /* SIDEBAR STYLES */
    .sidebar {
      width: 20%;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #1a1a1a;
      overflow-y: auto;
      padding: 1rem;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      scrollbar-width: thin;
      scrollbar-color: #555 #1a1a1a;
    }

    .sidebar::-webkit-scrollbar {
      width: 8px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background-color: #555;
      border-radius: 4px;
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
      background-color: #888;
    }

    .sidebar-row {
      display: flex;
      align-items: center;
      margin-bottom: 0.75rem;
      padding: 0.4rem;
      border-radius: 6px;
      text-decoration: none;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .sidebar-row:hover {
      background-color: #e50914; /* Netflix red */
      color: black;
    }

    .sidebar-flag {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      overflow: hidden;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .sidebar-flag img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sidebar-country {
      font-size: 0.9rem;
      color: white;
    }

    /* For the header flag */
    .header-flag {
      display: inline-block;
      width: 40px; /* Adjust the size of the circle */
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      margin-right: 15px;
    }

    .header-flag img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 2rem;
      display: inline-flex;
      align-items: center;
      color: white;
    }

    .main-content {
      margin-left: 20%;
      width: 80%;
    }

  </style>
</head>
<body>
  <div class="sidebar">
    <!-- Country Links Here -->
    <a href="belgium.html" class="sidebar-row">
      <div class="sidebar-flag">
        <img src="https://euroflix.s3.eu-north-1.amazonaws.com/flags/be.png" alt="Belgium" />
      </div>
      <div class="sidebar-country">Belgium</div>
    </a>
    <!-- Add more countries as needed -->
  </div>

  <div class="main-content">
    <div class="video-section">
      <h1>
        <div class="header-flag">
          <img src="https://euroflix.s3.eu-north-1.amazonaws.com/flags/be.png" alt="Belgium" />
        </div>
        Belgium
      </h1>

      <div class="grid-section">
        <div class="section-header">
          <h4>Eurovision Winners</h4>
          <a class="view-more" href="belgium.html">VIEW MORE</a>
        </div>

        <div class="grid-container">
          <!-- 2014 - AUSTRIA -->
          <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2014/videos/2014-AT.mp4')">
            <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
              <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2014/thumbs/2014-AT.jpeg" alt="Austria 2014 - Conchita Wurst">
              <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2014/videos/2014-AT.mp4" muted loop></video>
            </div>
            <div class="video-title-with-icon" onclick="event.stopPropagation()">
              <a href="belgium.html">
                <img class="icon-placeholder" src="https://euroflix.s3.eu-north-1.amazonaws.com/flags/at.png" alt="Flag">
              </a>
              <div class="video-title-text"><b>Conchita Wurst</b><br>Rise Like A Phoenix<br>2014</div>
            </div>
          </div>

          <!-- 2015 - SWEDEN -->
          <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2015/videos/2015-SE.mp4')">
            <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
              <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2015/thumbs/2015-SE.jpeg" alt="Sweden 2015 - Måns Zelmerlöw">
              <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2015/videos/2015-SE.mp4" muted loop></video>
            </div>
            <div class="video-title-with-icon" onclick="event.stopPropagation()">
              <a href="belgium.html">
                <img class="icon-placeholder" src="https://euroflix.s3.eu-north-1.amazonaws.com/flags/se.png" alt="Flag">
              </a>
              <div class="video-title-text">Måns Zelmerlöw<br>Heroes<br>2015</div>
            </div>
          </div>

          <!-- More Video Items Can Be Added -->
        </div>
      </div>
    </div>
  </div>

  <script>
    function openModalWithVideo(videoUrl) {
      const modal = document.createElement('div');
      modal.classList.add('modal');
      const closeButton = document.createElement('span');
      closeButton.classList.add('modal-close');
      closeButton.innerText = '×';
      modal.appendChild(closeButton);
      
      const videoElement = document.createElement('video');
      videoElement.src = videoUrl;
      videoElement.controls = true;
      modal.appendChild(videoElement);

      closeButton.addEventListener('click', () => {
        modal.style.display = 'none';
        videoElement.pause();
      });

      document.body.appendChild(modal);
      modal.style.display = 'flex';
    }

    function showPreview(element) {
      const video = element.querySelector('video');
      if (video) {
        video.style.display = 'block'; // Show the video
      }
    }

    function hidePreview(element) {
      const video = element.querySelector('video');
      if (video) {
        video.style.display = 'none'; // Hide the video
      }
    }
  </script>
</body>
</html>
