<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ESCFlix - Video Grid</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #141414;
      font-family: Arial, sans-serif;
      color: white;
    }

    .video-grid {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: 40px;
    }

    .video-row {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .video-card {
      background-color: #222;
      width: 200px;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .video-thumbnail {
      background-color: #444;
      width: 100%;
      height: 120px;
    }

    .video-title {
      padding: 10px 5px;
      font-size: 14px;
      text-align: center;
    }
  </style>
  
  <script type="text/javascript" src="euroflix.js"></script>
  
</head>
<body>
  <div class="video-grid">
    <div class="video-row">
      
      
      <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2014/videos/2014+-+Austria+-+Conchita+Wurst+-+Rise+Like+a+Phoenix.mp4')">
        <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
          <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2014/thumbs/2014-austria.jpeg" alt="Austria 2014 - Conchita Wurst">
          <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2014/videos/2014+-+Austria+-+Conchita+Wurst+-+Rise+Like+a+Phoenix.mp4" muted loop></video>
        </div>
      <div class="video-title">Conchita Wurst <br> Rise Like A Phoenix <br> 2014</div>
      </div>
      
      
      
      <div class="video-card">
        <div class="video-title">2024</div>
        <div class="video-thumbnail"></div>
        <div class="video-title">Video Title</div>
      </div>
      <div class="video-card">

        <div class="video-thumbnail"></div>

      </div>
      <div class="video-card">

      </div>

      </div>
      <div class="video-card">
        <div class="video-title">2020</div>

      </div>
    </div>
<div class="video-row">

  </div>
</body>
</html>
