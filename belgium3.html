<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>ESCFlix</title>
    <style>
      body {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #141414;
        display: flex;
      }

      /* Sidebar */
      .sidebar {
        width: 20%; /* 20% of the page width */
        background-color: #2b2b2b;
        color: white;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        padding: 20px;
        overflow-y: auto;
      }

      /* Main content */
      .main-content {
        width: 80%; /* 80% of the page width */
        margin-left: 20%; /* Space for the sidebar */
        padding: 20px;
      }

      h4 {
        font-size: 1.5rem;
        font-weight: bold;
        color: #e5e5e5;
        margin: 0 0 10px 10px;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* Adjust number of columns */
        gap: 20px;
      }

      .video-item {
        background-color: #333;
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.3s ease;
      }

      .video-item:hover {
        transform: scale(1.05);
      }

      .preview-container {
        width: 100%;
        height: 170px;
        position: relative;
      }

      .preview-container img,
      .preview-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
      }

      .preview-container video {
        display: none;
      }

      .video-title-with-icon {
        display: flex;
        color: #e5e5e5;
        background: #1f1f1f;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 10px;
        font-size: 0.75rem;
      }

      .icon-placeholder {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background-color: #444;
        object-fit: cover;
        margin-left: 8px;
      }

      .video-title-text {
        line-height: 1.2;
      }

      /* Modal Styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.9);
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        position: relative;
        background-color: #000;
        padding: 20px;
        max-width: 90%;
        max-height: 90%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .modal-content video {
        max-width: 100%;
        max-height: 80vh;
      }

      .close-button {
        position: absolute;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        font-size: 40px;
        top: 10px;
        right: 20px;
        z-index: 9999;
        border-radius: 50%;
      }

      .section-header {
        display: flex;
        align-items: baseline;
        gap: 20px;
        margin: 0 10px 10px 10px;
      }

      .section-header h4 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: bold;
        color: #e5e5e5;
      }

      .section-header .view-more {
        margin: 0;
        font-size: 0.9rem;
        font-weight: normal;
        color: #e50914;
        text-decoration: none;
      }

      .section-header .view-more:visited,
      .section-header .view-more:hover,
      .section-header .view-more:active,
      .section-header .view-more:focus {
        color: #e50914;
        text-decoration: none;
      }
    </style>
  </head>
  <body oncontextmenu="return false">
    <div class="sidebar">
      <!-- Sidebar content, like flag links and country names -->
    </div>

    <div class="main-content">
      <div class="grid-section">
        <div class="section-header">
          <h4>Eurovision Winners</h4>
          <a class="view-more" href="belgium.html">VIEW MORE</a>
        </div>

        <div class="grid-container">
          <!-- Example Video Items -->
          <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2014/videos/2014-AT.mp4')">
            <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
              <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2014/thumbs/2014-AT.jpeg" alt="Austria 2014 - Conchita Wurst">
              <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2014/videos/2014-AT.mp4" muted loop></video>
            </div>
            <div class="video-title-with-icon" onclick="event.stopPropagation()">
              <a href="belgium.html">
                <img class="icon-placeholder" src="https://euroflix.s3.eu-north-1.amazonaws.com/flags/at.png" alt="Flag">
              </a>
              <div class="video-title-text"><b>Conchita Wurst</b><br>Rise Like A Phoenix<br>2014</div>
            </div>
          </div>
          <!-- Add more video items in the same format -->
        </div>
      </div>
    </div>

    <script>
      function openModalWithVideo(videoUrl) {
        const modal = document.createElement('div');
        modal.classList.add('modal');
        modal.style.display = 'flex';

        modal.innerHTML = `
          <div class="modal-content">
            <span class="close-button" onclick="document.body.removeChild(this.closest('.modal'))">&times;</span>
            <video 
              src="${videoUrl}" 
              controls 
              autoplay 
              controlsList="nodownload" 
              oncontextmenu="return false"
            ></video>
          </div>
        `;

        document.body.appendChild(modal);
      }

      function closeModal() {
        const modal = document.getElementById("videoModal");
        modal.style.display = "none";
      }

      function showPreview(container) {
        const video = container.querySelector('video');
        const img = container.querySelector('img');
        img.style.display = 'none';
        video.style.display = 'block';
        video.play();
      }

      function hidePreview(container) {
        const video = container.querySelector('video');
        const img = container.querySelector('img');
        video.pause();
        video.style.display = 'none';
        img.style.display = 'block';
      }
    </script>
  </body>
</html>
