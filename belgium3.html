<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESCFlix</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-flag">
      <img src="path_to_flag_image1.jpg" alt="Country Flag">
      <span>Country Name 1</span>
    </div>
    <div class="sidebar-flag">
      <img src="path_to_flag_image2.jpg" alt="Country Flag">
      <span>Country Name 2</span>
    </div>
    <!-- Add more flags here -->
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="grid-container">
      <div class="grid-item">
        <img src="path_to_video_thumbnail1.jpg" alt="Video 1">
        <p>Video 1</p>
      </div>
      <div class="grid-item">
        <img src="path_to_video_thumbnail2.jpg" alt="Video 2">
        <p>Video 2</p>
      </div>
      <div class="grid-item">
        <img src="path_to_video_thumbnail3.jpg" alt="Video 3">
        <p>Video 3</p>
      </div>
      <div class="grid-item">
        <img src="path_to_video_thumbnail4.jpg" alt="Video 4">
        <p>Video 4</p>
      </div>
      <!-- Add more videos here -->
    </div>
  </div>
</body>
</html>
