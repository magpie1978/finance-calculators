    .sidebar {

      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background-color 0.3s;
    }
    
    .sidebar a:hover {

      border-radius: 8px;
    }    

    .sidebar img {
  width: 28px;

  object-fit: cover;
  border-radius: 50%;
  border: 1px solid #555;
}

    .flag-icon {

  height: 28px;
  object-fit: cover;
  border-radius: 50%;
}
    
 .main-content {

    h4 {

      font-weight: bold;
      color: #e5e5e5;
      margin: 0 0 10px 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .video-item {
      background-color: #333;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .video-item:hover {
      transform: scale(1.05);
    }

    .preview-container {
      width: 100%;
      height: 170px;
      position: relative;
    }

    .preview-container img,
    .preview-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }

    .preview-container video {
      display: none;
    }

    .video-title-with-icon {

      color: #e5e5e5;

      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 10px;
      font-size: 0.75rem;

    .icon-placeholder {

      height: 24px;
      border-radius: 50%;
      background-color: #444;
      object-fit: cover;
      margin-left: 8px;
    }

    .video-title-text {
      line-height: 1.2;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      background-color: #000;
      padding: 20px;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content video {
      max-width: 100%;
      max-height: 80vh;
    }

    .close-button {
      position: absolute;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 40px;
      top: 10px;
      right: 20px;
      z-index: 9999;
      border-radius: 50%;
    }

    .section-header {

      align-items: baseline;
      gap: 20px;

      text-decoration: none;
    }
  </style>

  <!-- Modal (used by JS) -->
  <div id="videoModal" class="modal" onclick="closeModal(event)">
    <span class="modal-close" onclick="closeModal(event)">&times;</span>
    <video id="modalVideo" controls autoplay controlsList="nodownload"></video>
  </div>

  <script>
    function openModalWithVideo(videoUrl) {
      const modal = document.createElement('div');
      modal.classList.add('modal');
      modal.style.display = 'flex';

      modal.innerHTML = `
        <div class="modal-content">
          <span class="close-button" onclick="document.body.removeChild(this.closest('.modal'))">&times;</span>
          <video 
            src="${videoUrl}" 
            controls 
            autoplay 
            controlsList="nodownload" 
            oncontextmenu="return false"
          ></video>
        </div>
      `;

      document.body.appendChild(modal);
    }

    function closeModal() {
      const modal = document.getElementById("videoModal");
      modal.style.display = "none";
    }

    function showPreview(container) {
      const video = container.querySelector('video');
      const img = container.querySelector('img');
      img.style.display = 'none';
      video.style.display = 'block';
      video.play();
    }

    function hidePreview(container) {
      const video = container.querySelector('video');
      const img = container.querySelector('img');
      video.pause();
      video.style.display = 'none';
      img.style.display = 'block';
    }
  </script>
