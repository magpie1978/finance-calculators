<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESCFlix</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f0f0f0;
    }

    .carousel-section {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto 30px auto;
      text-align: left;
    }

    .carousel-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-button {
      width: 50px;
      height: 50px;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
      margin: 0 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .carousel-button:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .carousel-container {
      position: relative;
      width: 90%;
      max-width: 1200px;
      overflow: hidden;
      border: 1px solid #ccc;
      background: #fff;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.3s ease;
      scroll-behavior: smooth;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .video-item {
      flex: 0 0 auto;
      width: 300px;
      margin: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }

    .preview-container {
      width: 100%;
      height: 170px;
      position: relative;
    }

    .preview-container img,
    .preview-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    .preview-container video {
      display: none;
    }

    .video-title {
      color: #333;
      background: #fff;
      padding: 10px 8px;
      font-size: 0.95rem;
      text-align: center;
      width: 100%;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      background-color: #000;
      padding: 20px;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content video {
      max-width: 100%;
      max-height: 80vh;
    }

    .close-button {
      position: absolute;
      top: 5px;
      right: 15px;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="carousel-section">
    <h4>Eurovision Winners</h4>

    <div class="carousel-wrapper">
      <button class="carousel-button" onclick="scrollCarousel(-1)">&#10094;</button>

      <div class="carousel-container">
        <div class="carousel-track" id="carouselTrack">

          <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2014+-+Austria+-+Conchita+Wurst+-+Rise+Like+a+Phoenix.mp4')">
            <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
              <img src="https://euroflix.s3.eu-north-1.amazonaws.com/conchita.jpeg" alt="Austria 2014">
              <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2014+-+Austria+-+Conchita+Wurst+-+Rise+Like+a+Phoenix.mp4" muted loop></video>
            </div>
            <div class="video-title">Conchita Wurst <br> Rise Like A Phoenix <br> 2014</div>
          </div>

          <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2015+-+Sweden+-+M%C3%A5ns+Zelmerl%C3%B6w+-+Heroes.mp4')">
            <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
              <img src="https://euroflix.s3.eu-north-1.amazonaws.com/mans.jpeg" alt="Sweden 2015">
              <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2015+-+Sweden+-+M%C3%A5ns+Zelmerl%C3%B6w+-+Heroes.mp4" muted loop></video>
            </div>
            <div class="video-title">Måns Zelmerlöw <br> Heroes <br> 2015</div>
          </div>

          <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2018+-+Israel+-+Netta+-+Toy.mp4')">
            <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
              <img src="https://euroflix.s3.eu-north-1.amazonaws.com/netta.jpeg" alt="Israel 2018">
              <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2018+-+Israel+-+Netta+-+Toy.mp4" muted loop></video>
            </div>
            <div class="video-title">Netta <br> Toy <br> 2018</div>
          </div>

          <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2021+-+Italy+-+M%C3%A5neskin+-+Zitti+e+buoni.mp4')">
            <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
              <img src="https://euroflix.s3.eu-north-1.amazonaws.com/maneskin.jpeg" alt="Italy 2021">
              <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2021+-+Italy+-+M%C3%A5neskin+-+Zitti+e+buoni.mp4" muted loop></video>
            </div>
            <div class="video-title">Måneskin <br> Zitti e buoni <br> 2021</div>
          </div>

          <!-- Add more video-items if needed -->

        </div>
      </div>

      <button class="carousel-button" onclick="scrollCarousel(1)">&#10095;</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="videoModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-button" onclick="closeModal()">&times;</span>
      <div id="modalVideoContainer"></div>
    </div>
  </div>

  <script>
    function scrollCarousel(direction) {
      const track = document.getElementById('carouselTrack');
      const scrollAmount = 1280;
      track.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    function openModalWithVideo(src) {
      const modal = document.getElementById("videoModal");
      const container = document.getElementById("modalVideoContainer");
      const modalVideo = `<video src="${src}" controls autoplay></video>`;
      container.innerHTML = modalVideo;
      modal.style.display = "flex";
    }

    function closeModal() {
      const modal = document.getElementById("videoModal");
      const container = document.getElementById("modalVideoContainer");
      modal.style.display = "none";
      container.innerHTML = "";
    }

    function showPreview(container) {
      const img = container.querySelector('img');
      const video = container.querySelector('video');
      img.style.display = 'none';
      video.style.display = 'block';
      video.currentTime = 0;
      video.play();
    }

    function hidePreview(container) {
      const img = container.querySelector('img');
      const video = container.querySelector('video');
      video.pause();
      video.style.display = 'none';
      img.style.display = 'block';
    }
  </script>

</body>
</html>
