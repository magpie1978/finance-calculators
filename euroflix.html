<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AWS S3 Video Test</title>
  <style>
    .video-item video {
      width: 100%;
      max-width: 600px;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content video {
      max-width: 90vw;
      max-height: 80vh;
    }

    .close-button {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>AWS S3 Video Test</h2>

  <div class="video-item">
    <video width="800" controls>
      <source src="https://euroflix.s3.eu-north-1.amazonaws.com/2014+-+Austria+-+Conchita+Wurst+-+Rise+Like+a+Phoenix.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Modal -->
  <div id="videoModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-button" onclick="closeModal()">&times;</span>
      <div id="modalVideoContainer"></div>
    </div>
  </div>

  <script>
    const s3Video = document.getElementById('s3Video');
    s3Video.addEventListener('click', () => {
      const src = s3Video.getAttribute('src');
      const modalHTML = `<video src="${src}" controls autoplay></video>`;
      document.getElementById('modalVideoContainer').innerHTML = modalHTML;
      document.getElementById('videoModal').style.display = 'flex';
    });

    function closeModal() {
      document.getElementById('videoModal').style.display = 'none';
      document.getElementById('modalVideoContainer').innerHTML = '';
    }
  </script>

</body>
</html>
