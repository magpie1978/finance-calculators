<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Carousel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f0f0f0;
      text-align: center;
    }

    .carousel-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-button {
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: white;
      font-size: 2rem;
      padding: 15px;
      cursor: pointer;
      margin: 0 10px;
      border-radius: 50%;
      transition: background 0.3s;
    }

    .carousel-button:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .carousel-container {
      position: relative;
      width: 90%;
      max-width: 1200px;
      overflow: hidden;
      border: 1px solid #ccc;
      background: #fff;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.3s ease;
      scroll-behavior: smooth;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .video-item {
      position: relative;
      flex: 0 0 auto;
      width: 300px;
      margin: 10px;
      background: #000;
    }

    .video-item iframe,
    .video-item video {
      width: 100%;
      height: auto;
      display: block;
    }

    .iframe-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      z-index: 10;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      background-color: #000;
      padding: 20px;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content iframe,
    .modal-content video {
      max-width: 100%;
      max-height: 80vh;
    }

    .close-button {
      position: absolute;
      top: 5px;
      right: 15px;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Video Carousel</h2>

  <div class="carousel-wrapper">
    <button class="carousel-button" onclick="scrollCarousel(-1)">&#10094;</button>
    
    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack">
        <!-- Google Drive embed with overlay -->
        <div class="video-item">
          <iframe src="https://www.youtube.com/embed/SaolVEJEjV4" allow="autoplay; encrypted-media" allowfullscreen frameborder="0"> </iframe>
          <div class="iframe-overlay" data-src="https://www.youtube.com/embed/SaolVEJEjV4"></div>
        </div>


        
        <!-- Regular videos -->
        <div class="video-item"><video src="video2.mp4" controls></video></div>
        <div class="video-item"><video src="video3.mp4" controls></video></div>
        <div class="video-item"><video src="video4.mp4" controls></video></div>
        <div class="video-item"><video src="video5.mp4" controls></video></div>
        <div class="video-item"><video src="video6.mp4" controls></video></div>
        <div class="video-item"><video src="video7.mp4" controls></video></div>
        <div class="video-item"><video src="video8.mp4" controls></video></div>
        <div class="video-item"><video src="video9.mp4" controls></video></div>
        <div class="video-item"><video src="video10.mp4" controls></video></div>
      </div>
    </div>

    <button class="carousel-button" onclick="scrollCarousel(1)">&#10095;</button>
  </div>  
  
  <!-- Modal Overlay -->
  <div id="videoModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-button" onclick="closeModal()">&times;</span>
      <div id="modalVideoContainer"></div>
    </div>
  </div>

  <script>
    function scrollCarousel(direction) {
      const track = document.getElementById('carouselTrack');
      const scrollAmount = 1280;
      track.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    function openModalWithVideo(videoHTML) {
      const modal = document.getElementById("videoModal");
      const container = document.getElementById("modalVideoContainer");
      container.innerHTML = videoHTML;
      modal.style.display = "flex";
    }

    function closeModal() {
      const modal = document.getElementById("videoModal");
      const container = document.getElementById("modalVideoContainer");
      container.innerHTML = "";
      modal.style.display = "none";
    }

    window.onload = function () {
      // Handle <video> clicks
      document.querySelectorAll(".carousel-track video").forEach(video => {
        video.addEventListener("click", () => {
          const src = video.getAttribute("src");
          const modalVideo = `<video src="${src}" controls autoplay></video>`;
          openModalWithVideo(modalVideo);
        });
      });

      // Handle iframe overlays
      document.querySelectorAll(".iframe-overlay").forEach(overlay => {
        overlay.addEventListener("click", () => {
          const src = overlay.getAttribute("data-src");
          const modalIframe = `<iframe src="${src}" width="800" height="450" allow="autoplay" allowfullscreen></iframe>`;
          openModalWithVideo(modalIframe);
        });
      });
    };
  </script>

</body>
</html>
