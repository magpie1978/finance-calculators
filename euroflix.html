<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EuroFlix</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f0f0f0;
      text-align: center;
    }

    .carousel-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-button {
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: white;
      font-size: 2rem;
      padding: 15px;
      cursor: pointer;
      margin: 0 10px;
      border-radius: 50%;
      transition: background 0.3s;
    }

    .carousel-button:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .carousel-container {
      position: relative;
      width: 90%;
      max-width: 1200px;
      overflow: hidden;
      border: 1px solid #ccc;
      background: #fff;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.3s ease;
      scroll-behavior: smooth;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .video-item {
      flex: 0 0 auto;
      width: 300px;
      margin: 10px;
      background: #000;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
    }

    .video-item video,
    .video-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .video-title {
      color: #333;
      background: #fff;
      padding: 10px 8px;
      font-size: 0.95rem;
      text-align: center;
      width: 100%;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      background-color: #000;
      padding: 20px;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content video {
      max-width: 100%;
      max-height: 80vh;
    }

    .close-button {
      position: absolute;
      top: 5px;
      right: 15px;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>EuroFlix</h2>

  <div class="carousel-wrapper">
    <button class="carousel-button" onclick="scrollCarousel(-1)">&#10094;</button>
    
    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack">
        
        


        <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2014+-+Austria+-+Conchita+Wurst+-+Rise+Like+a+Phoenix.mp4')">
          <img src="https://euroflix.s3.eu-north-1.amazonaws.com/conchita.jpeg" alt="Austria 2014 - Conchita Wurst">
          <div class="video-title">Austria 2014 <br> Conchita Wurst <br> Rise Like A Phoenix</div>
        </div>


        
        <!-- Other videos (not yet updated) -->
        <div class="video-item"><video src="video2.mp4" controls></video></div>
        <div class="video-item"><video src="video3.mp4" controls></video></div>
        <div class="video-item"><video src="video4.mp4" controls></video></div>
        <div class="video-item"><video src="video5.mp4" controls></video></div>
        <div class="video-item"><video src="video6.mp4" controls></video></div>
        <div class="video-item"><video src="video7.mp4" controls></video></div>
        <div class="video-item"><video src="video8.mp4" controls></video></div>
        <div class="video-item"><video src="video9.mp4" controls></video></div>
        <div class="video-item"><video src="video10.mp4" controls></video></div>
      </div>
    </div>

    <button class="carousel-button" onclick="scrollCarousel(1)">&#10095;</button>
  </div>  

  <!-- Modal -->
  <div id="videoModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close-button" onclick="closeModal()">&times;</span>
      <div id="modalVideoContainer"></div>
    </div>
  </div>

  <script>
    function scrollCarousel(direction) {
      const track = document.getElementById('carouselTrack');
      const scrollAmount = 1280;
      track.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    function openModalWithVideo(src) {
      const modal = document.getElementById("videoModal");
      const container = document.getElementById("modalVideoContainer");
      const modalVideo = `<video src="${src}" controls autoplay></video>`;
      container.innerHTML = modalVideo;
      modal.style.display = "flex";
    }

    function closeModal() {
      const modal = document.getElementById("videoModal");
      const container = document.getElementById("modalVideoContainer");
      modal.style.display = "none";
      container.innerHTML = "";
    }
  </script>

</body>
</html>
