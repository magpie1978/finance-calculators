<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Carousel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f0f0f0;
      text-align: center;
    }

    .carousel-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-button {
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: white;
      font-size: 2rem;
      padding: 15px;
      cursor: pointer;
      margin: 0 10px;
      border-radius: 50%;
      transition: background 0.3s;
    }

    .carousel-button:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .carousel-container {
      position: relative;
      width: 90%;
      max-width: 1200px;
      overflow: hidden;
      border: 1px solid #ccc;
      background: #fff;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.3s ease;
      scroll-behavior: smooth;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .video-item {
      flex: 0 0 auto;
      width: 300px;
      margin: 10px;
      background: #000;
    }

    .video-item video {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <h2>Video Carousel</h2>

  <div class="carousel-wrapper">
    <button class="carousel-button" onclick="scrollCarousel(-1)">&#10094;</button>
    
    <div class="carousel-container">
      <div class="carousel-track" id="carouselTrack">
        <div class="video-item"><iframe src="https://drive.google.com/file/d/1tXU36v4E2o5pZI98wmLS5AZTox5M3agH/preview" width="300" height="200" allow="autoplay" allowfullscreen> </iframe> </div>
        <div class="video-item"><video src="video1.mp4" controls></video></div>
        <div class="video-item"><video src="video2.mp4" controls></video></div>
        <div class="video-item"><video src="video3.mp4" controls></video></div>
        <div class="video-item"><video src="video4.mp4" controls></video></div>
        <div class="video-item"><video src="video5.mp4" controls></video></div>
        <div class="video-item"><video src="video6.mp4" controls></video></div>
        <div class="video-item"><video src="video7.mp4" controls></video></div>
        <div class="video-item"><video src="video8.mp4" controls></video></div>
        <div class="video-item"><video src="video9.mp4" controls></video></div>
        <div class="video-item"><video src="video10.mp4" controls></video></div>
      </div>
    </div>

    <button class="carousel-button" onclick="scrollCarousel(1)">&#10095;</button>
  </div>

  <script>
    function scrollCarousel(direction) {
      const track = document.getElementById('carouselTrack');
      const scrollAmount = 1280;
      track.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }
  </script>

</body>
</html>
