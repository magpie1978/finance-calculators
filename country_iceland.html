<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ESCFlix</title>
  
  <script type="text/javascript" src="euroflix.js"></script>
  
  <style>
    body {
      margin: 0;
      background-color: #141414;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 20px;
      font-size: 2rem;
      font-weight: bold;
    }

    .video-gallery {
      display: flex;
      gap: 20px;
      padding: 20px;
      overflow-x: auto;
    }

    .video-thumbnail {
      width: 300px;
      height: 170px;
      background-color: #333;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }

    .video-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      max-width: 80%;
      max-height: 80%;
    }

    .modal video {
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    .close {
      position: absolute;
      top: -40px;
      right: 0;
      font-size: 32px;
      cursor: pointer;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="header">ESCFlix v0.1</div>

  <div class="video-gallery">
    <div class="video-thumbnail" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2015/videos/2015+-+Sweden+-+Mans+Zelmerlow+-+Heroes.mp4')">
      <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2015/thumbs/2015-sweden.jpeg" alt="ESC Video 1" />
    </div>
    <div class="video-thumbnail" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2015/videos/2015+-+Sweden+-+Mans+Zelmerlow+-+Heroes.mp4')">
      <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2015/thumbs/2015-sweden.jpeg" alt="ESC Video 2" />
    </div>
    <div class="video-thumbnail" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2015/videos/2015+-+Sweden+-+Mans+Zelmerlow+-+Heroes.mp4')">
      <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2015/thumbs/2015-sweden.jpeg" alt="ESC Video 3" />
    </div>
    <div class="video-thumbnail" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2015/videos/2015+-+Sweden+-+Mans+Zelmerlow+-+Heroes.mp4')">
      <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2015/thumbs/2015-sweden.jpeg" alt="ESC Video 4" />
    </div>
    <div class="video-thumbnail" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2015/videos/2015+-+Sweden+-+Mans+Zelmerlow+-+Heroes.mp4')">
      <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2015/thumbs/2015-sweden.jpeg" alt="ESC Video 5" />
    </div>
  </div>

  <div id="videoModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="close" onclick="closeModal()">&times;</span>
      <video id="modalVideo" controls autoplay></video>
    </div>
  </div>

  <script>
    function openModalWithVideo(videoUrl) {
      const modal = document.getElementById('videoModal');
      const video = document.getElementById('modalVideo');
      video.src = videoUrl;
      modal.style.display = 'flex';
      video.play();
    }

    function closeModal() {
      const modal = document.getElementById('videoModal');
      const video = document.getElementById('modalVideo');
      modal.style.display = 'none';
      video.pause();
      video.currentTime = 0;
      video.src = '';
    }
  </script>

</body>
</html>
