<!DOCTYPE html>
<html lang="en">

<!-- ===============================================-->
<!--    HEADER-->
<!-- ===============================================-->
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date of Birth</title>
    <link rel="stylesheet" type="text/css" href="styles.css">  <!-- Link to stylesheet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">  <!-- stylesheet for info icon -->
  </head>


<!-- ===============================================-->
<!--    BODY-->
<!-- ===============================================-->
  <body>
    <div class="form-style-8">
      <div class="tooltip">
          <i class="fas fa-info-circle info-icon"></i>
          <span class="tooltiptext">We need this to determine your age, and how long you have left until retirement.</span>
      </div>

      <h4>Enter your date of birth</h4>
      <input type="date" id="datepicker" min="1930-01-01" max="" required>
      <br>
      <center>
        <button type="button" class="add-pot-btn" onclick="saveAndRedirect()">Next</button>
      </center>
    </div>


    <p>Learn Eclipse</p>
      <br />
      <iframe width="560" height="315" src="https://www.youtube.com/embed/y881t8ilMyc" frameborder="0" allowfullscreen></iframe>
      <iframe width="560" height="315" src="https://www.youtube.com/watch?v=QRUIava4WRM&pp=ygUtcmlzZSBsaWtlIGEgcGhvZW5peCBjb25jaGl0YSB3dXJzdCAyMDE0IGZpbmFs" frameborder="0" allowfullscreen></iframe>
      

    

<!-- ===============================================-->
<!--    SCRIPTING-->
<!-- ===============================================-->

    <script>
      const today = new Date();                            //Get today's date
      const maxDate = today.toISOString().split('T')[0];   //Set max date in datepicker to today's date
      datepicker.max = maxDate;

      // Function to save entered data and move to next page
      function saveAndRedirect() {
        // save entered data into constants
        const dateOfBirth = document.getElementById("datepicker").value;    //set date of birth constant
        const selectedDate = new Date(dateOfBirth);                         //set selected date to date of birth value
        const yearOfBirth = selectedDate.getFullYear();                     //set year of birth constant
        const yearWhen75 = selectedDate.getFullYear() + 75;                 //work out year when user is 75
        const statePensionAge = selectedDate.getFullYear() + 67;            //work out year when user is reaches State Pension Age
        const monthOfBirth = selectedDate.getMonth() + 1;                   //set month of birth constant
        const monthNames = ["January", "February", "March", "April", "May", "June","July", "August", "September", "October", "November", "December"];
        const monthOfBirthName = monthNames[selectedDate.getMonth()];       //set month of birth name caonstant

        // Calculate the minimum and maximum allowed years for the retirement start year
        const minYear = new Date(dateOfBirth).getFullYear() + 55;
        const maxYear = new Date(dateOfBirth).getFullYear() + 70;

        // save constant values into sessionStorage
        sessionStorage.setItem('dateOfBirth', dateOfBirth);
        sessionStorage.setItem('yearOfBirth', yearOfBirth);
        sessionStorage.setItem('monthOfBirth', monthOfBirth);
        sessionStorage.setItem('monthOfBirthName', monthOfBirthName);
        sessionStorage.setItem('yearWhen75', yearWhen75);
        sessionStorage.setItem('statePensionAge', statePensionAge);
        sessionStorage.setItem('minYear', minYear);
        sessionStorage.setItem('maxYear', maxYear);


        // set URL for next page
        window.location.href = "enter-sex.html";
      }

      // an event listener is added so that if user comes back to page
      // the previously entered values are displayed
      document.addEventListener('DOMContentLoaded', restoreFormValues);

      function restoreFormValues() {
        const dateOfBirth = sessionStorage.getItem('dateOfBirth');
        if (dateOfBirth) {
          document.getElementById("datepicker").value = dateOfBirth;
        }
      }

    </script>
  </body>
</html>
