<!DOCTYPE html>
<html lang="en">

<!-- ===============================================-->
<!--    HEADER-->
<!-- ===============================================-->

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile Optimisation -->
    <title>One-Off Cash Sums</title>
    <link rel="stylesheet" type="text/css" href="styles.css"> <!-- Link to Stylesheet -->
  </head>




<!-- ===============================================-->
<!--    BODY-->
<!-- ===============================================-->

  <body>
    <br><br>

    <!-- DIVISION TO HOLD THE PAGE -->
    <div class="form-style-8">
      <!-- DIVISION TO HOLD THE TITLE AND 'ADD' BUTTON -->
      <div class="section">
        <br<><br>
        <h2>Cash</h2>
        <button id="addButton" class="add-pot-btn top-right-btn" onclick="openAddCashPotDialog()">+</button>
      </div>
      <!-- END OF TITLE DIVISION -->

      <br>

      <!-- DIVISION FOR POP-UP DIALOGUE BOX -->
      <div id="addCashPotDialog" class="popup">
        <div class="popup-content">
          <span class="popup-close" onclick="closeAddCashPotDialog()">&times;</span>
          <h3>Add Cash</h3>
          <h4>Lorem ipsum dolor sit amet, consectetur adipiscing elit</h4>

          <!-- TABLE TO STRUCTURE DATA ENTRY -->
          <table>
            <tr>
              <td><label for="cashProvider">Source:</label></td>
              <td>
                <select id="cashProvider">
                  <option value="House Downsize">House Downsize</option>
                  <option value="Equity Release">Equity Release</option>
                  <option value="Second Home Sale">Second Home Sale</option>
                  <option value="Other">Other</option>
                </select>
              </td>
            </tr>
            <tr>
              <td><label for="currentCashValue">Amount:</label></td>
              <td><input type="number" id="currentCashValue" required></td>
            </tr>
            <tr>
              <td><label for="YearCashReceived">Year:</label></td>
              <td>
                <select id="YearCashReceived" required>
                  <!-- JavaScript will populate the options dynamically -->
                </select>
              </td>
            </tr>
            <tr>
              <td colspan="2">
                <div class="dialog-buttons">
                  <button type="button" class="add-pot-btn" onclick="addCashPot()">Add</button>
                </div>
                <br>
              </td>
            </tr>
          </table>
        </div>
      </div> <!-- END OF DIVISION FOR POP-UP DIALOGUE BOX

      <!-- OUTPUT FROM DIALOGIE BOX IN TEXTUAL FORM -->
      <table class="pension-table" style="margin-top: 20px; width: 100%; display: none;">
        <tbody id="addedCashPotsTableBody"></tbody>
      </table>
    </div>  <!-- END OF DIVISION FOR PAGE -->

    <center>
      <button type="button" class="back-btn" onclick="location.href='enter-investments.html'">Back</button>
      <button type="button" class="add-pot-btn" onclick="location.href='enter-other-income.html'">Next</button>
    </center>

    <br><br>



<!-- ===============================================-->
<!--    SCRIPTING-->
<!-- ===============================================-->

    <script src="script.js"></script>  <!-- Link to JavaScript function repository -->

    <script>

    //LISTENER THAT TRIGGERS OTHER FUNCTIONS
    document.addEventListener('DOMContentLoaded', function() {
      calculateAndStoreYearsUntilRetirement(); // Calculate and store years until retirement on load
      displayCashPots(); // Display the cash pots on page load
      updateAddButtonState(); // Update the state of the add button on page load
    });



    // FUNTION TO CALCULATE YEARS UNTIL RETIREMENT
    calculateAndStoreYearsUntilRetirement()

    //function calculateAndStoreYearsUntilRetirement() {
    //  const currentYear = new Date().getFullYear();
    //  const yearOfBirth = parseInt(sessionStorage.getItem('yearOfBirth'));
    //  const retirementAge = parseInt(sessionStorage.getItem('retirementAge'));
    //  const yearsUntilRetirement = retirementAge - (currentYear - yearOfBirth);
    //  sessionStorage.setItem('yearsUntilRetirement', yearsUntilRetirement);
    //}



    // FUNCTION TO OPEN POP-UP DIALOGIE BOX
    function openAddCashPotDialog() {
      document.getElementById("addCashPotDialog").style.display = "block";
      resetDialogFields();

      const yearOfBirth = parseInt(sessionStorage.getItem('yearOfBirth'));
      const selectYear = document.getElementById("YearCashReceived");
      selectYear.innerHTML = "";

      for (let i = 55; i <= 70; i++) {
        const option = document.createElement("option");
        option.value = yearOfBirth + i;
        option.textContent = yearOfBirth + i;
        selectYear.appendChild(option);
      }
    }



    // FUNCTION TO RESET DIALOGUE BOX FIELDS ON RE-ENTRY
    function resetDialogFields() {
      document.getElementById("cashProvider").value = "House Downsize";
      document.getElementById("currentCashValue").value = "";
      document.getElementById("YearCashReceived").selectedIndex = 0;
    }



    // FUNCTION TO CLOSE POP-UP DIALOGUE BOX
    function closeAddCashPotDialog() {
      document.getElementById("addCashPotDialog").style.display = "none";
    }



    // FUNCTION TO DELETE AN ENTRY
    function deleteCashPot(id) {
      const index = cashPots.findIndex(pot => pot.id === id);
      if (index !== -1) {
        // Remove the cash pot from the array
        cashPots.splice(index, 1);
        // Set the sessionStorage values to 0 for the deleted entry
        setSessionStorageToZero(index + 1);
        // Save the updated cashPots array to sessionStorage
        sessionStorage.setItem('cashPots', JSON.stringify(cashPots));
        // Update the sessionStorage values for the remaining entries
        saveCashPotsToSession();
        // Update the display
        displayCashPots();
        // Update the add button state
        updateAddButtonState();
      }

      if (cashPots.length === 0) {
        resetAllSessionStorageValues();
      }
    }



    // FUNCTION TO SET SELECTED SESSION STORAGE ITEMS TO ZERO (USED WHRN DELETING ENTRIES)
    function setSessionStorageToZero(index) {
      sessionStorage.setItem('cashProvider_' + index, 0);
      sessionStorage.setItem('currentCashValue_' + index, 0);
      sessionStorage.setItem('YearCashReceived_' + index, 0);
      sessionStorage.setItem('estimatedCashValueAtRetirement_' + index, 0);
    }



    // FUNCTION TO SET ALL STORAGE VALUES TO ZERO
    function resetAllSessionStorageValues() {
      for (let i = 1; i <= 5; i++) {
        setSessionStorageToZero(i);
      }
    }



    let cashPots = JSON.parse(sessionStorage.getItem('cashPots')) || [];



    // FUNCTION TO DISPLAY ENTRIES IN TEXTUAL STYLE
    function displayCashPots() {
      const tbody = document.getElementById('addedCashPotsTableBody');
      tbody.innerHTML = '';

      cashPots.forEach((pot, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
        <td class="pot-details"><br><b>${pot.cashProvider}</b><br><br>
        The cash value is ${pot.currentCashValue.toLocaleString('en-UK', { style: 'currency', currency: 'GBP', minimumFractionDigits: 0, maximumFractionDigits: 0 })} and is expected to be received in ${pot.yearReceived}. The estimated value at retirement is ${pot.estimatedCashValueAtRetirement.toLocaleString('en-UK', { style: 'currency', currency: 'GBP', minimumFractionDigits: 0, maximumFractionDigits: 0 })}.</td>
        <td><button class="delete-pot-btn" onclick="deleteCashPot('${pot.id}')">Delete</button></td>
        `;
        tbody.appendChild(row);
      });

      if (cashPots.length > 0) {
        document.querySelector('.pension-table').style.display = "table";
      } else {
        document.querySelector('.pension-table').style.display = "none";
      }
    }



    // FUNCTION TO ADD AN ENTRY IN DIALGUE BOX
    function addCashPot() {
      const cashProvider = document.getElementById("cashProvider").value;
      const currentCashValue = parseFloat(document.getElementById("currentCashValue").value);
      const yearReceived = parseInt(document.getElementById("YearCashReceived").value);

      if (isNaN(currentCashValue)) {
        alert("Please enter a valid amount.");
        return;
      }

      const id = Date.now().toString();
      const currentYear = new Date().getFullYear();
      const yearOfBirth = parseInt(sessionStorage.getItem('yearOfBirth'));
      const retirementAge = parseInt(sessionStorage.getItem('retirementAge'));
      const yearsUntilRetirement = retirementAge - (currentYear - yearOfBirth);

      let estimatedCashValueAtRetirement = currentCashValue;

      if (cashProvider !== 'Tax Free Pension Cash') {
        for (let i = 0; i < yearsUntilRetirement; i++) {
          estimatedCashValueAtRetirement *= 1.025;
        }
      }

      const newCashPot = {
        id,
        cashProvider,
        currentCashValue,
        estimatedCashValueAtRetirement,
        yearReceived
      };

      cashPots.push(newCashPot);

      sessionStorage.setItem('cashPots', JSON.stringify(cashPots));

      displayCashPots();
      closeAddCashPotDialog();
      saveCashPotToSession(newCashPot, cashPots.length);
      updateAddButtonState(); // Update the add button state after adding a new entry
    }



    // FUNCTION TO SAVE DATA ENTERED INTO SESSION STORAGE
    function saveCashPotToSession(cashPot, index) {
      sessionStorage.setItem('cashProvider_' + index, cashPot.cashProvider);
      sessionStorage.setItem('currentCashValue_' + index, cashPot.currentCashValue.toFixed(2));
      sessionStorage.setItem('YearCashReceived_' + index, cashPot.yearReceived);
      sessionStorage.setItem('estimatedCashValueAtRetirement_' + index, cashPot.estimatedCashValueAtRetirement.toFixed(2));
    }



    // FUNCTION TO TRIGGER FUNCTION TO SAVE DATA ENTERED INTO SESSION STORAGE
    function saveCashPotsToSession() {
      cashPots.forEach((pot, index) => {
        saveCashPotToSession(pot, index + 1);
      });
    }


    // FUNCTION TO CHANGE 'ADD' BUTTON STATE IF MAXIMUM ENTRIES REACHED
    function updateAddButtonState() {
      const addButton = document.getElementById('addButton');
      if (cashPots.length >= 5) {
        addButton.disabled = true;
        addButton.style.backgroundColor = 'gray';
        addButton.style.cursor = 'not-allowed';
      } else {
        addButton.disabled = false;
        addButton.style.backgroundColor = '#4CAF50';
        addButton.style.cursor = 'pointer';
      }
    }

    </script>
  </body>
</html>
