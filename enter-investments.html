<!DOCTYPE html>
<html lang="en">


<!-- ===============================================-->
<!--    HEADER-->
<!-- ===============================================-->

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- Mobile Optimisation -->
    <title>Savings & Investments</title>
    <link rel="stylesheet" type="text/css" href="styles.css"> <!-- Link to stylesheet -->
  </head>



<!-- ===============================================-->
<!--    BODY-->
<!-- ===============================================-->

  <body>
    <br><br>

    <!-- DIVISION FOR SAVINGS & INVESTMENTS -->
    <div class="container">

      <!-- DIVISION FOR TITLE BAR AND ADD BUTTON -->
      <div class="section">
        <h2>Savings and Investments</h2>
          <button id="addSavingsPotButton" class="add-pot-btn top-right-btn" onclick="openAddSavingsPotDialog()">+</button>
      </div>
      <br>

      <!-- DIVISION FOR POP-UP DIALOGUE BOX -->
      <div id="addSavingsPotDialog" class="popup">
        <!--  DIVISION FOR POP-Up DIALOGUE BOX -->
        <div class="popup-content">
          <span class="popup-close" onclick="closeAddSavingsPotDialog()">&times;</span>
          <h3>Add Savings and Investments</h3>
          <h4>Lorem ipsum dolor sit amet, consectetur adipiscing elit</h4>
          <table>
            <tr>
              <td><label for="savingsProvider">Account Type:</label></td>
              <td><select id="savingsProvider">
                <option value="" disabled selected>Select investment type</option>
			          <option value="Cash ISA">Cash ISA</option>
                <option value="Stocks & Shares ISA">Stocks & Shares ISA</option>
                <option value="General Investment Account">General Investment Account (GIA)</option>
                <option value="Cash Savings">Cash Savings</option>
              </select></td>
            </tr>
            <tr>
              <td><label for="currentSavingsValue">Current Value:</label></td>
              <td><input type="number" id="currentSavingsValue" required></td>
            </tr>
            <tr>
              <td><label for="monthlySavings">Monthly Contributions:</label></td>
              <td><input type="number" id="monthlySavings" required></td>
            </tr>
            <tr>
              <td colspan="2">
                <div class="dialog-buttons">
                  <button type="button" class="add-pot-btn" onclick="addSavingsPot()">Add</button>
                </div>
                <br>
              </td>
            </tr>
          </table>
        </div>
      </div> <!-- END OF DIVISION FOR POP-UP DIALOGUE BOX -->

      <!-- TABLE TO DISPLAY DATA ENTERED IN A TEXTUAL WAY -->
      <table class="pension-table" style="margin-top: 20px; width: 100%; display: none;">
        <tbody id="addedSavingsPotsTableBody"></tbody>  <!-- DATA ENTERED BY JAVASCRIPT -->
      </table>
    </div> <!-- END OF DIVISION FOR SAVINGS & INVESTMENTS -->

    <center>
      <button type="button" class="back-btn" onclick="location.href='enter-db-pensions.html'">Back</button>
      <button type="button" class="add-pot-btn" onclick="location.href='enter-cash.html'">Next</button>
    </center>

    <br><br>



<!-- ===============================================-->
<!--    SCRIPTING-->
<!-- ===============================================-->

  <script src="script.js"></script>  <!-- Link to JavaScript function repository -->

  <script>

    // LISTENERS
    document.addEventListener('DOMContentLoaded', function() {
      loadInitialSavingsData();  // FUNCTION TO SHOW PREVIOUSLY ENTERED DATA ON RETURN TO PAGE
      calculateAndStoreYearsUntilRetirement(); // FUNCTION TO CALCULATE YEARS UNTIL RETIREMENT
      checkMaxEntries(); // FUNCTION TO CHECK NUMBER OF USER ENTRIES
    });

    let savingsPots = JSON.parse(sessionStorage.getItem('savingsPots')) || [];


    // FUNCTION TO DISPLAY SAVINGS POTS DATA IN TEXTUAL FORMAT
    function displaySavingsPots() {
      const tbody = document.getElementById('addedSavingsPotsTableBody');
      tbody.innerHTML = '';
      let totalCurrentSavingsValue = 0;
      let totalMonthlySavings = 0;
      let totalEstimatedSavingsValueAtRetirement = 0;

      savingsPots.forEach(pot => {
        totalCurrentSavingsValue += pot.currentSavingsValue;
        totalMonthlySavings += pot.monthlySavings;
        totalEstimatedSavingsValueAtRetirement += pot.estimatedSavingsValueAtRetirement;
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="pot-details"><br><b>${pot.savingsProvider} Account</b><br><br>
          The account currently worth ${pot.currentSavingsValue.toLocaleString('en-UK', { style: 'currency', currency: 'GBP', minimumFractionDigits: 0, maximumFractionDigits: 0 })} and should increase to ${pot.estimatedSavingsValueAtRetirement.toLocaleString('en-UK', { style: 'currency', currency: 'GBP', minimumFractionDigits: 0, maximumFractionDigits: 0 })} by retirement.</td>
          <td><button class="delete-pot-btn" onclick="deleteSavingsPot('${pot.id}')">Delete</button></td>
          `;
          tbody.appendChild(row);
        });

        // SAVE DATA INTO SESSION STORAGE
        sessionStorage.setItem('totalCurrentInvestmentValue', totalCurrentSavingsValue);
        sessionStorage.setItem('totalMonthlyInvestmentContributions', totalMonthlySavings);
        sessionStorage.setItem('totalInvestmentValueAtRetirement', totalEstimatedSavingsValueAtRetirement);
        sessionStorage.setItem('savingsPots', JSON.stringify(savingsPots));

        // HIDE TABLE STRUCTURE IF THERE ARE NO ENTRIES
        if (savingsPots.length === 0) {
          document.querySelector('.pension-table').style.display = "none";
        } else {
          document.querySelector('.pension-table').style.display = "table";
        }

        checkMaxEntries(); // CALL FUNCTION TO CHECK MAXIMUM ENTRIES
      }


      // FUNCTION TO ADD SAVINGS POTS FROM DIALOGUE BOX TO PAGE
      function addSavingsPot() {
        const savingsProvider = document.getElementById("savingsProvider").value;
        const currentSavingsValue = parseFloat(document.getElementById("currentSavingsValue").value);
        let monthlySavings = parseFloat(document.getElementById("monthlySavings").value);

        if (!savingsProvider || isNaN(currentSavingsValue) || isNaN(monthlySavings)) {
          alert("Please fill in all fields correctly.");
          return;
        }

        const id = Date.now().toString();
        const currentYear = new Date().getFullYear();
        const yearOfBirth = parseInt(sessionStorage.getItem('yearOfBirth'));
        const retirementAge = parseInt(sessionStorage.getItem('retirementAge'));
        const yearsUntilRetirement = retirementAge - (currentYear - yearOfBirth);

        let estimatedSavingsValueAtRetirement = currentSavingsValue;
        for (let i = 0; i < yearsUntilRetirement; i++) {
          estimatedSavingsValueAtRetirement *= 1.06;
          estimatedSavingsValueAtRetirement += (monthlySavings * 12);
          monthlySavings *= 1.025;
        }

        savingsPots.push({
          id,
          savingsProvider,
          currentSavingsValue,
          monthlySavings,
          estimatedSavingsValueAtRetirement
        });

        sessionStorage.setItem('savingsPots', JSON.stringify(savingsPots));
        displaySavingsPots();
        closeAddSavingsPotDialog();
      }


      // FUNCTION TO OPEN POP-UP DIALOGUE BOX
      function openAddSavingsPotDialog() {
        const rowIds = JSON.parse(sessionStorage.getItem('savingsPots')) || [];
        if (rowIds.length >= 5) {
          alert("You can only add up to 5 entries.");
        } else {
          document.getElementById("addSavingsPotDialog").style.display = "block";
        }
        resetDialogFields();  // Reset the dialog fields every time the dialog is opened
      }



      // FUNCTION TO RESET DIALOGUE BOX ENTRIES ON RE-OPEN
      function resetDialogFields() {
        document.getElementById("savingsProvider").value = "";
        document.getElementById("currentSavingsValue").value = "";
        document.getElementById("monthlySavings").value = "";
      }


      // FUNCTION TO CLOSE DIALOGUE BOX
      function closeAddSavingsPotDialog() {
        document.getElementById("addSavingsPotDialog").style.display = "none";
      }


      // FUNCTION TO DELETE SAVINGS ENTRY
      function deleteSavingsPot(id) {
        const index = savingsPots.findIndex(pot => pot.id === id);
        if (index !== -1) {
          savingsPots.splice(index, 1);
          sessionStorage.setItem('savingsPots', JSON.stringify(savingsPots));
          displaySavingsPots();
        }
      }


      // FUNCTION TO LOAD SAVINGS DATA ALEADY ENTERED WHRN USER RETURNS TO PAGE
      function loadInitialSavingsData() {
        if (savingsPots.length > 0) {
          document.querySelector('.pension-table').style.display = "table";
          displaySavingsPots();
        }
      }


      //FUNCTION TO CALCUKATE YEARS UNTIL RETIREMENT
      calculateAndStoreYearsUntilRetirement()



      // FUNCTION TO CHECK NUMBER OF ENTRIES - MAX 5
      function checkMaxEntries() {
        const addButton = document.getElementById('addSavingsPotButton');
        const rowIds = JSON.parse(sessionStorage.getItem('savingsPots')) || [];
        if (rowIds.length >= 5) {
          addButton.classList.add('disabled-btn');
          addButton.disabled = true;
        } else {
          addButton.classList.remove('disabled-btn');
          addButton.disabled = false;
        }
      }

    </script>
  </body>
</html>
