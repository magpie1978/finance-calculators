<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESCFlix</title>
  <link rel="stylesheet" type="text/css" href="euroflix_css.css">
  <script type="text/javascript" src="euroflix.js"></script>
  <style>
    .grid-section {
      padding: 20px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .video-item {
      cursor: pointer;
    }

    .preview-container {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .preview-container img,
    .preview-container video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    .preview-container video {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }

    .video-title {
      margin-top: 8px;
      text-align: center;
      color: white;
    }
  </style>
</head>
<body>

  <div class="grid-section">
    <h4>Eurovision Winners</h4>
    <div class="video-grid">
      <!-- Paste all your video-item blocks here, e.g.: -->

      <div class="video-item" onclick="openModalWithVideo('https://euroflix.s3.eu-north-1.amazonaws.com/2014/videos/2014+-+Austria+-+Conchita+Wurst+-+Rise+Like+a+Phoenix.mp4')">
        <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
          <img src="https://euroflix.s3.eu-north-1.amazonaws.com/2014/thumbs/2014-austria.jpeg" alt="Austria 2014 - Conchita Wurst">
          <video src="https://euroflix.s3.eu-north-1.amazonaws.com/2014/videos/2014+-+Austria+-+Conchita+Wurst+-+Rise+Like+a+Phoenix.mp4" muted loop></video>
        </div>
        <div class="video-title">Conchita Wurst <br> Rise Like A Phoenix <br> 2014</div>
      </div>

      <!-- Add the rest of your video items here... -->

    </div>
  </div>

</body>
</html>
