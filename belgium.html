<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ESCFlix</title>
  <style>
    body {
      background-color: #141414;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      padding: 1rem;
      font-size: 2rem;
    }

    .video-section {
      padding: 1rem 2rem;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }

    .preview-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 aspect ratio */
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
    }

    .preview-container img,
    .preview-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    .preview-container img {
      z-index: 1;
    }

    .preview-container video {
      z-index: 2;
      display: none;
    }
  </style>
</head>
<body>
  <h1>ESCFlix</h1>

  <div class="video-section">
    <h2>Eurovision Highlights</h2>
    <div class="video-grid">
      <!-- Video 1 -->
      <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
        <img src="https://via.placeholder.com/400x225?text=Thumbnail+1" alt="Thumbnail 1" />
        <video src="https://your-s3-bucket-url/video1.mp4" muted loop></video>
      </div>

      <!-- Video 2 -->
      <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
        <img src="https://via.placeholder.com/400x225?text=Thumbnail+2" alt="Thumbnail 2" />
        <video src="https://your-s3-bucket-url/video2.mp4" muted loop></video>
      </div>

      <!-- Video 3 -->
      <div class="preview-container" onmouseover="showPreview(this)" onmouseout="hidePreview(this)">
        <img src="https://via.placeholder.com/400x225?text=Thumbnail+3" alt="Thumbnail 3" />
        <video src="https://your-s3-bucket-url/video3.mp4" muted loop></video>
      </div>

      <!-- Add more video blocks as needed -->
    </div>
  </div>

  <script>
    function showPreview(container) {
      const video = container.querySelector('video');
      if (video) {
        video.style.display = 'block';
        video.play();
      }
    }

    function hidePreview(container) {
      const video = container.querySelector('video');
      if (video) {
        video.pause();
        video.currentTime = 0;
        video.style.display = 'none';
      }
    }
  </script>
</body>
</html>
